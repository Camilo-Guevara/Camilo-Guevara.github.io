<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulso Vial · Explorador 3D</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0b1e2a;color:#eaf6f6;font:14px system-ui}.tools{display:flex;flex-wrap:wrap;gap:12px;padding:12px;background:#102b38;align-items:center}.tools label{display:flex;align-items:center;gap:5px}.tools input[type=range]{width:90px}select,button{background:#163847;border:1px solid #46616c;color:#fff;border-radius:6px;padding:6px}#map3d{height:min(72vh,650px);min-height:390px}#status{padding:10px;color:#b9d5d7}.maplibregl-popup-content{color:#122b34}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:9px 12px;background:#112b38;color:#cde0e4;font-size:12px}.legend b{color:#ffbd75}a{color:#7fe6d5}@media(max-width:650px){#map3d{height:58vh;min-height:360px}.tools{gap:9px}}</style></head><body><div class="tools"><label><input id="terrain" type="checkbox" checked> Relieve 3D</label><label><input id="points" type="checkbox" checked> Siniestros</label><label><input id="heat" type="checkbox"> Mapa de calor</label><label><input id="buildings" type="checkbox"> Edificios 3D</label><label>Exageración <input id="exag" type="range" min="1" max="8" step=".5" value="3"><output id="exagValue">3×</output></label><label>Año <select id="yr"><option value="">Todos</option></select></label><label>Horario <select id="hr"><option value="">Todos</option><option value="0">00–03</option><option value="1">04–07</option><option value="2">08–11</option><option value="3">12–15</option><option value="4">16–19</option><option value="5">20–23</option><option value="6">Sin dato</option></select></label><button id="reset">Reiniciar vista</button></div><div id="map3d" role="region" aria-label="Mapa interactivo de siniestros fatales de CABA"></div><div class="legend"><span><b>●</b> Hecho fatal georreferenciado</span><span>Mapa de calor: concentración de hechos, no tasa de riesgo</span><span>Relieve con exageración visual ajustable</span></div><div id="status" role="status">Preparando mapa…</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script><script>
const $=id=>document.getElementById(id);let all=[],selected=[],map,ready=false,buildingsAvailable=false;
const pointData=()=>({type:'FeatureCollection',features:selected.filter(r=>Number.isFinite(r.lon)&&Number.isFinite(r.lat)&&r.lon>-58.55&&r.lon<-58.32&&r.lat>-34.73&&r.lat<-34.51).map(r=>({type:'Feature',geometry:{type:'Point',coordinates:[r.lon,r.lat]},properties:{id:r.id,date:r.date,hour:r.hour==null?'Sin dato':r.hour+' h',comuna:r.comuna||'Sin dato',via:r.via,lugar:r.lugar,n:r.n}}))});
function refresh(){const y=$('yr').value,h=$('hr').value;selected=all.filter(r=>(!y||r.date.slice(0,4)===y)&&(h===''||String(r.hour==null?6:Math.floor(r.hour/4))===h));const geo=pointData();if(ready&&map.getSource('accidents'))map.getSource('accidents').setData(geo);$('status').textContent=selected.length+' hechos según filtros · '+geo.features.length+' con coordenadas · '+(selected.length-geo.features.length)+' sin ubicación representable. Los faltantes siguen incluidos en los indicadores del dashboard.'}
function visibility(id,shown){if(ready&&map.getLayer(id))map.setLayoutProperty(id,'visibility',shown?'visible':'none')}
function terrain(){if(!ready)return;try{map.setTerrain($('terrain').checked?{source:'dem',exaggeration:Number($('exag').value)}:null)}catch(e){$('status').textContent='El terreno 3D no está disponible en este dispositivo.'}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='pulso-vial-data')return;all=e.data.rows||[];const years=[...new Set(all.map(r=>r.date.slice(0,4)))].sort();const old=$('yr').value;$('yr').innerHTML='<option value="">Todos</option>'+years.map(y=>'<option>'+y+'</option>').join('');$('yr').value=old;refresh()});
$('yr').onchange=refresh;$('hr').onchange=refresh;$('points').onchange=()=>visibility('accident-points',$('points').checked);$('heat').onchange=()=>visibility('accident-heat',$('heat').checked);$('buildings').onchange=()=>{visibility('pv-buildings',$('buildings').checked);if($('buildings').checked&&!buildingsAvailable)$('status').textContent='La cartografía base no ofrece una capa de edificios compatible en esta sesión.'};$('terrain').onchange=terrain;$('exag').oninput=()=>{$('exagValue').textContent=$('exag').value+'×';terrain()};$('reset').onclick=()=>map&&map.flyTo({center:[-58.44,-34.61],zoom:10.8,pitch:58,bearing:-12,duration:900});
try{map=new maplibregl.Map({container:'map3d',style:'https://tiles.openfreemap.org/styles/bright',center:[-58.44,-34.61],zoom:10.8,pitch:58,bearing:-12,antialias:true});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));map.on('load',()=>{ready=true;map.addSource('dem',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'Terrain tiles: Mapzen/AWS'});map.addSource('accidents',{type:'geojson',data:pointData()});map.addLayer({id:'accident-heat',type:'heatmap',source:'accidents',layout:{visibility:'none'},paint:{'heatmap-weight':1,'heatmap-intensity':['interpolate',['linear'],['zoom'],9,.7,13,2],'heatmap-radius':['interpolate',['linear'],['zoom'],9,13,14,28],'heatmap-opacity':.7,'heatmap-color':['interpolate',['linear'],['heatmap-density'],0,'rgba(0,0,0,0)',.25,'#1dd9c2',.5,'#ffcc70',.8,'#ff705a',1,'#ed3c54']}});const src=Object.entries(map.getStyle().sources||{}).find(([name,s])=>s.type==='vector');if(src){try{map.addLayer({id:'pv-buildings',type:'fill-extrusion',source:src[0],'source-layer':'building',minzoom:13,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#5c8595','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],0],'fill-extrusion-base':0,'fill-extrusion-opacity':.55}});buildingsAvailable=true}catch(e){}}map.addLayer({id:'accident-points',type:'circle',source:'accidents',paint:{'circle-radius':['interpolate',['linear'],['zoom'],9,3,14,7],'circle-color':'#ffbd75','circle-stroke-color':'#0a2431','circle-stroke-width':1.5,'circle-opacity':.9}});map.on('click','accident-points',e=>{const p=e.features[0].properties;const el=document.createElement('div');for(const [k,v] of [['Hecho',p.id],['Fecha',p.date],['Hora',p.hour],['Comuna',p.comuna],['Tipo de vía',p.via],['Lugar',p.lugar],['Víctimas fatales',p.n]]){const line=document.createElement('div');line.textContent=k+': '+v;el.appendChild(line)}new maplibregl.Popup({maxWidth:'300px'}).setLngLat(e.lngLat).setDOMContent(el).addTo(map)});map.on('mouseenter','accident-points',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','accident-points',()=>map.getCanvas().style.cursor='');terrain();refresh();parent.postMessage({type:'pulso-vial-ready'},location.origin)});map.on('error',()=>{$('status').textContent='Algunos mosaicos cartográficos pueden no estar disponibles. Revisá la conexión a internet.'})}catch(e){$('status').textContent='No se pudo iniciar el mapa 3D: '+e.message}
parent.postMessage({type:'pulso-vial-ready'},location.origin);
<\/script></body></html>
